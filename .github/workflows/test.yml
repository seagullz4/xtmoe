name: Test XTMOE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Parse shell files
        shell: bash
        run: |
          bash -n \
            termux.sh \
            src/bin/xtmoe \
            src/lib/common.sh \
            src/lib/proot.sh \
            src/lib/chroot.sh \
            src/lib/manager.sh \
            src/lib/xtmoe-root \
            tests/run.sh \
            tests/android-smoke.sh \
            tests/rootfs-lifecycle.sh

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck -x -S warning \
            termux.sh \
            src/bin/xtmoe \
            src/lib/common.sh \
            src/lib/proot.sh \
            src/lib/chroot.sh \
            src/lib/manager.sh \
            src/lib/xtmoe-root \
            tests/run.sh \
            tests/android-smoke.sh \
            tests/rootfs-lifecycle.sh

      - name: Run simulated lifecycle tests
        shell: bash
        run: |
          set +e
          bash tests/run.sh
          status=$?
          set -e
          if ((status != 0)); then
            bash -x tests/run.sh >test-output.log 2>&1 || true
            python3 - <<'PY'
          from pathlib import Path

          text = Path("test-output.log").read_text(encoding="utf-8", errors="replace")[-1500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=XTMOE simulated tests failed::{text}")
          PY
            exit "$status"
          fi

      - name: Check whitespace
        run: git diff --check
